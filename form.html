<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>template</title>
    <link rel="stylesheet" href="repo/assets/css/form.css">
    <script src="repo/assets/java/side.js" defer></script>
</head>
<body>
    <form action="#" method="post">
        <label for="name">Navn:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="nummer">Telefonnummer:</label>
        <input type="tel" id="nummer" name="nummer" required>

        <label for="bemærkninger">Bemærkninger:</label>
        <input type="text" id="bemærkninger" name="bemærkninger">

        <label for="arrangement">Arrangement:</label>
        <input type="text" id="arrangement" name="arrangement">

        <input id="submit" type="submit" value="Send">
    </form>
    <div id="form-feedback" aria-live="polite"></div>
</body>
</html>
